name: mainline-kernel (archived)

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitattributes'
  workflow_dispatch:

env:
  # 锁死内核版本：mt6735-mainline/linux 的 mt6735-staging 分支
  KCOMMIT: a62a3e8f93c1f1d047167c6944339732ffa38f54
  KURL: https://gitlab.com/mt6735-mainline/linux/-/archive

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev device-tree-compiler \
            gcc-aarch64-linux-gnu make python3 xz-utils

      - name: Fetch kernel source
        run: |
          curl -L --retry 3 --retry-delay 5 -o linux.tar.gz \
            "$KURL/$KCOMMIT/linux-$KCOMMIT.tar.gz"
          tar xf linux.tar.gz
          mv "linux-$KCOMMIT" kernel
          du -sh kernel

      - name: Prepare initramfs (fetch static busybox for aarch64)
        run: |
          mkdir -p initramfs/bin initramfs/dev initramfs/proc \
                   initramfs/sys initramfs/tmp
          chmod +x initramfs/init
          URL=https://ports.ubuntu.com/ubuntu-ports/pool/main/b/busybox
          DEB=$(curl -sL "$URL/" | grep -oE 'busybox-static_[0-9][^"]*_arm64\.deb' | sort -V | tail -1)
          echo "downloading $DEB"
          curl -sLO "$URL/$DEB"
          dpkg-deb -x "$DEB" bb-extract
          BUSYBOX=$(find bb-extract -name busybox -type f | head -1)
          cp "$BUSYBOX" initramfs/bin/busybox
          chmod 755 initramfs/bin/busybox
          cd initramfs/bin
          for a in sh ash ls cat mount umount sleep echo mkdir mknod dmesg \
                   uname grep head poweroff reboot setsid true printf pwd; do
            ln -sf busybox "$a"
          done
          ls -l sh
          file initramfs/bin/busybox
          ./initramfs/bin/busybox 2>&1 | head -2 || true

      - name: Overlay device tree
        run: |
          cp dts/mt6735-gionee-gn3002.dts kernel/arch/arm64/boot/dts/mediatek/
          sed -i '3i dtb-$(CONFIG_ARCH_MEDIATEK) += mt6735-gionee-gn3002.dtb' \
            kernel/arch/arm64/boot/dts/mediatek/Makefile
          grep -n gionee kernel/arch/arm64/boot/dts/mediatek/Makefile

      - name: Configure
        run: |
          cd kernel
          cp ../config/pmos-mt6735.config .config
          ./scripts/config \
            --enable MFD_MT6397 \
            --enable KEYBOARD_MTK_PMIC \
            --enable USB_MUSB_MEDIATEK \
            --enable NOP_USB_XCEIV \
            --enable TOUCHSCREEN_EDT_FT5X06 \
            --enable CMDLINE_FORCE \
            --enable PSTORE_PMSG \
            --enable FB_SIMPLE
          ./scripts/config --set-str CMDLINE \
            "earlycon=uart8250,mmio,0x11002000,115200n8 console=tty0 ignore_loglevel clk_ignore_unused pd_ignore_unused regulator_ignore_unused PMOS_NO_OUTPUT_REDIRECT PMOS_NOSPLASH"
          ../scripts/trim-config.sh .
          ./scripts/config --set-str INITRAMFS_SOURCE "$PWD/../initramfs"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -E '^CONFIG_(INITRAMFS_SOURCE|CMDLINE|CMDLINE_FORCE|MTK_PMIC_WRAP|REGULATOR_MT6328|MMC_MTK|PINCTRL_MT6735)=' .config

      - name: Build Image.gz and DTB
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image.gz
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            mediatek/mt6735-gionee-gn3002.dtb
          echo "=== built-in initramfs contents ==="
          cpio -itv < usr/initramfs_data.cpio | head -30

      - name: Pack boot images
        run: |
          mkdir -p out
          cp kernel/arch/arm64/boot/Image.gz out/Image.gz
          cp kernel/arch/arm64/boot/dts/mediatek/mt6735-gionee-gn3002.dtb out/
          gunzip -c out/Image.gz > out/Image
          python3 scripts/mkbootimg_mtk.py \
            --kernel out/Image.gz --dtb out/mt6735-gionee-gn3002.dtb \
            --cmdline "bootopt=64S3,32N2,64N2" --name gn3002 \
            --out out/boot-gz.img
          python3 scripts/mkbootimg_mtk.py \
            --kernel out/Image --dtb out/mt6735-gionee-gn3002.dtb \
            --cmdline "bootopt=64S3,32N2,64N2" --name gn3002 \
            --out out/boot-raw.img
          (cd out && sha256sum *.img *.dtb *.gz)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gn3002-boot
          path: out/*
          if-no-files-found: error
          retention-days: 30

  # QEMU 冒烟测试：MT6735 无法完整模拟，但可以用 virt 虚拟机
  # （同为 4x Cortex-A53）验证「内核本体 + initramfs 逻辑」是否健康，
  # 把「内核问题」和「MT6735 硬件适配问题」区分开。
  qemu-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu make xz-utils \
            qemu-system-arm qemu-efi-aarch64

      - name: Fetch kernel source
        run: |
          curl -L --retry 3 --retry-delay 5 -o linux.tar.gz \
            "$KURL/$KCOMMIT/linux-$KCOMMIT.tar.gz"
          tar xf linux.tar.gz
          mv "linux-$KCOMMIT" kernel

      - name: Prepare initramfs (fetch static busybox for aarch64)
        run: |
          mkdir -p initramfs/bin initramfs/dev initramfs/proc \
                   initramfs/sys initramfs/tmp
          chmod +x initramfs/init
          URL=https://ports.ubuntu.com/ubuntu-ports/pool/main/b/busybox
          DEB=$(curl -sL "$URL/" | grep -oE 'busybox-static_[0-9][^"]*_arm64\.deb' | sort -V | tail -1)
          echo "downloading $DEB"
          curl -sLO "$URL/$DEB"
          dpkg-deb -x "$DEB" bb-extract
          BUSYBOX=$(find bb-extract -name busybox -type f | head -1)
          cp "$BUSYBOX" initramfs/bin/busybox
          chmod 755 initramfs/bin/busybox
          cd initramfs/bin
          for a in sh ash ls cat mount umount sleep echo mkdir mknod dmesg \
                   uname grep head poweroff reboot setsid true printf pwd; do
            ln -sf busybox "$a"
          done
          ls -l sh

      - name: Configure for QEMU virt
        run: |
          cd kernel
          cp ../config/pmos-mt6735.config .config
          ./scripts/config \
            --disable CMDLINE_FORCE \
            --set-str CMDLINE "" \
            --enable ARM_AMBA \
            --enable SERIAL_AMBA_PL011 \
            --enable SERIAL_AMBA_PL011_CONSOLE \
            --enable SERIAL_EARLYCON
          ../scripts/trim-config.sh .
          ./scripts/config --set-str INITRAMFS_SOURCE "$PWD/../initramfs"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -E '^CONFIG_(CMDLINE|SERIAL_AMBA_PL011|SERIAL_EARLYCON|INITRAMFS_SOURCE|BLK_DEV_INITRD|RD_GZIP|DEVTMPFS_MOUNT)=' .config

      - name: Build Image
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image

      - name: Boot in QEMU and check initramfs banner
        run: |
          timeout 90 qemu-system-aarch64 \
            -M virt,gic-version=2 -cpu cortex-a53 -m 1024 \
            -nographic -no-reboot -nic none \
            -kernel kernel/arch/arm64/boot/Image \
            -append "console=ttyAMA0 earlycon=pl011,0x09000000 loglevel=7 panic=-1" \
            > serial.log 2>&1 || true
          echo "=== serial output (last 40 lines) ==="
          tail -40 serial.log
          # QEMU virt 上 /dev 节点未自动建立，init 的打印可能不可见，
          # 因此以「内核起来 + initramfs 里的 /init 成功执行 + 无 panic」为准。
          grep -q "Run /init as init process" serial.log \
            || { echo "SMOKE TEST FAILED: /init not reached"; exit 1; }
          ! grep -q "Failed to execute /init" serial.log \
            || { echo "SMOKE TEST FAILED: /init cannot be executed"; exit 1; }
          ! grep -q "Kernel panic" serial.log \
            || { echo "SMOKE TEST FAILED: kernel panic"; exit 1; }
          grep -q "GN3002 mainline kernel - initramfs reached" serial.log \
            && echo "bonus: initramfs banner visible" || true
          echo "SMOKE TEST PASSED"

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-log
          path: serial.log
          if-no-files-found: error
          retention-days: 30
